[package]
name = "lintel-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser bindings for Lintel: keys, secrets and plaintext never leave the device."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lintel = { path = "../engine", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ff = "0.14"
group = "0.14"
pasta_curves = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
