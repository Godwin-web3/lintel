[package]
name = "lintel"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
autobins = false

[features]
default = ["multicore"]
multicore = ["halo2_proofs/multicore", "orchard?/multicore"]
# On-chain settlement (NU6.3+/NU7 testnet, Ironwood pool, V6 PCZTs).
chain = [
    "dep:orchard", "dep:pczt", "dep:zcash_primitives", "dep:zcash_protocol",
    "dep:zcash_address", "dep:incrementalmerkletree", "dep:anyhow", "dep:rand_core",
    "dep:zcash_note_encryption", "dep:zcash_transparent", "dep:secp256k1", "dep:bs58",
]
# lightwalletd client for the lintel-chain CLI.
net = ["chain", "dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tokio", "dep:http"]
inject = ["chain"]
# Seller agent: finishes on-chain sales while the app is closed (lintel-agent).
agent = ["net", "dep:reqwest", "tokio/signal"]

[dependencies]
blake2b_simd = "1.0"
ff = "0.14"
group = "0.14"
pasta_curves = "0.6"
rand = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
halo2_proofs = { version = "0.4", default-features = false, features = ["batch"] }
halo2_gadgets = "0.6"
# Same pasta 0.6 / ff 0.14 stack as the engine, so scalars and points are shared types.
orchard = { version = "0.16", optional = true, default-features = false, features = ["circuit", "std"] }
pczt = { version = "=0.10.0-pre.2", optional = true, features = ["orchard", "signer", "prover", "io-finalizer", "tx-extractor", "zcp-builder", "spend-finalizer"] }
zcash_primitives = { version = "=0.31.0-pre.2", optional = true, default-features = false, features = ["std", "circuits"] }
zcash_protocol = { version = "=0.11.0-pre.1", optional = true }
zcash_address = { version = "=0.14.0-pre.2", optional = true }
incrementalmerkletree = { version = "0.9", optional = true, features = ["legacy-api"] }
rand_core = { version = "0.10", optional = true }
zcash_note_encryption = { version = "0.5.1", optional = true }
anyhow = { version = "1", optional = true }
# Time-locked refund (v2): one payer-owned P2PKH input with a non-final sequence.
zcash_transparent = { version = "=0.11.0-pre.2", optional = true, features = ["transparent-inputs"] }
secp256k1 = { version = "0.33", optional = true }
bs58 = { version = "0.5", optional = true, features = ["check"] }
tonic = { version = "0.14", optional = true, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen"] }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "time"] }
http = { version = "1", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }

[lib]
name = "lintel"
path = "src/lib.rs"

[[bin]]
name = "lintel-cli"
path = "src/bin/lintel-cli.rs"

[[bin]]
name = "lintel-inject"
path = "src/bin/lintel-inject.rs"
required-features = ["inject"]

[[bin]]
name = "lintel-chain"
path = "src/bin/lintel-chain.rs"
required-features = ["net"]

[[bin]]
name = "lintel-agent"
path = "src/bin/lintel-agent.rs"
required-features = ["agent"]

[[test]]
name = "agent"
required-features = ["net"]

[[example]]
name = "testnet_sale"
required-features = ["net"]
