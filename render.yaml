# Render blueprint for the Lintel relay (public data only).
services:
  - type: web
    name: lintel-relay
    runtime: node
    plan: free
    rootDir: web/relay
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        # Must equal the deployed app origin: a Blueprint sync re-applies this value.
        value: https://lintel-godwin-web3s-projects.vercel.app
      # Persistent storage on the free plan: create a free Upstash Redis
      # database (https://console.upstash.com) and paste its REST URL and
      # token in the Render dashboard. With both set the relay uses Upstash
      # automatically; without them it falls back to the ephemeral file.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
    # Free instances have an ephemeral filesystem: without Upstash, listings
    # reset on redeploy. On a paid plan you can instead uncomment a disk:
    # disk:
    #   name: lintel-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add env DATA_FILE=/var/data/lintel.json
